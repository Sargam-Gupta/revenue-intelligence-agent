# Self-hosted n8n with the project pipeline baked in.
#
#   docker compose -f n8n/docker-compose.yml up -d --build
#   open http://localhost:5678
#
# The repo is mounted at /repo, so Execute Command nodes operate on the real
# working tree and Node 5 can push real commits. For the live demo, have the
# repo checked out on `main` and clean.
services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revintel-n8n
    ports:
      - "5678:5678"
    # Local secrets (gitignored). Optional so n8n can come up and Nodes 1-3 can be
    # tested before the keys exist; Node 4 needs ANTHROPIC_API_KEY, Node 5 GH_TOKEN.
    env_file:
      - path: .env
        required: false
    environment:
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
      # Commit identity for Node 5 — matches the repo's GitHub author exactly.
      - GIT_AUTHOR_NAME=Sargam Gupta
      - GIT_AUTHOR_EMAIL=107276370+Sargam-Gupta@users.noreply.github.com
      - GIT_COMMITTER_NAME=Sargam Gupta
      - GIT_COMMITTER_EMAIL=107276370+Sargam-Gupta@users.noreply.github.com
    volumes:
      - ./data:/home/node/.n8n   # n8n's own state (gitignored via n8n/data/)
      - ../:/repo                # the project repo, read-write (cache writes + git push)
    restart: unless-stopped
